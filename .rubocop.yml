AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'result/**/*'

# The house style this port follows puts every widget in a memoized method and
# every bit of configuration in a tap block, which produces long but flat
# build/widget methods by design.
Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 110

Naming/MethodName:
  AllowedPatterns: ['\A_\z']

Naming/MethodParameterName:
  MinNameLength: 1

# The declarative house style is built on chained tap/then blocks and on
# handlers whose boolean return value is part of the GTK signal contract.
Style/MultilineBlockChain:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Style/FormatStringToken:
  EnforcedStyle: template
  AllowedMethods:
    - format

# --- shared house cops (cops/) ---
require:
  - ./cops/begin_block_assignment.rb
  - ./cops/multiline_method_arguments.rb
  - ./cops/no_conditional_assignment.rb
  - ./cops/no_console_logging.rb
  - ./cops/no_modifier_if.rb
  - ./cops/no_return.rb
  - ./cops/use_tap.rb

Local/BeginBlockAssignment:
  Enabled: true

Local/NoConditionalAssignment:
  Enabled: true

Local/NoModifierIf:
  Enabled: true

Local/NoReturn:
  Enabled: true

Local/NoConsoleLogging:
  Enabled: true

Local/UseTap:
  Enabled: true

Local/MultilineMethodArguments:
  Enabled: true
  MaxArguments: 3
